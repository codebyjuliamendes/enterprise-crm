name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enterprise-crm:ci .
      - name: Smoke test
        run: |
          docker run -d --name crm -p 3004:3004 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-password-123456 \
            enterprise-crm:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' crm)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' crm | grep -q healthy
          curl -fsS http://localhost:3004/health
          token=$(curl -fsS -X POST http://localhost:3004/api/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123456"}' | jq -r .token)
          curl -fsS http://localhost:3004/api/stats -H "Authorization: Bearer $token"
          curl -fsS -o /dev/null http://localhost:3004/
          test "$(docker exec crm id -u)" != "0"
      - name: Container logs
        if: always()
        run: docker logs crm || true
