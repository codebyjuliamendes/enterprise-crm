services:
  app:
    build: .
    image: enterprise-crm:local
    ports:
      - '${PORT:-3004}:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      # Required in production: generate with `openssl rand -hex 32` and put it in .env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - crm-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  crm-data:
