apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-crm
  labels:
    app: enterprise-crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-crm
  template:
    metadata:
      labels:
        app: enterprise-crm
    spec:
      containers:
      - name: enterprise-crm
        image: enterprise-crm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
        env:
        - name: PORT
          value: "3004"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 15
          periodSeconds: 20
