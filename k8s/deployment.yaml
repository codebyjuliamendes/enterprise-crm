apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-crm
  labels:
    app: enterprise-crm
spec:
  # sql.js keeps the database in process memory and flushes it to a file, so exactly one
  # replica may own the volume. Running more replicas would silently diverge and lose writes.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: enterprise-crm
  template:
    metadata:
      labels:
        app: enterprise-crm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: enterprise-crm
          image: enterprise-crm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3004'
            - name: DB_PATH
              value: /app/data/crm.db
            - name: TRUST_PROXY
              value: '1'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: enterprise-crm-secrets
                  key: jwt-secret
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: enterprise-crm-secrets
                  key: admin-email
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-crm-secrets
                  key: admin-password
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: enterprise-crm-data
        - name: tmp
          emptyDir: {}
