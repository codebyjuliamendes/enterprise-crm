apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-crm-ingress
  labels:
    app: enterprise-crm
spec:
  ingressClassName: nginx
  rules:
    - host: enterprise-crm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-crm-svc
                port:
                  name: http
