<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sign in - Enterprise CRM</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <h1>Enterprise CRM</h1>
      <p class="subtitle">Sign in to your workspace</p>
      <form id="login-form" class="stack" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div id="login-error" class="alert" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
      </form>
      <div class="login-footer">
        <a href="/api-docs">API documentation</a>
      </div>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
